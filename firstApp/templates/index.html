<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to My First App</h1>
    </header>
    <main>
        <p>This is a simple HTML template for your application.</p>
        <p>{{myValue}}</p>
        <p>{{myList}}</p>
        <ul>
            {% for item in myList %}

                <li {% if item == 3 %} style="color: red;"{% endif %}>{{ item }}</li>

            {% endfor %}
        </ul>
    </main>
    <footer>
        <p>&copy; 2025 My First App. All rights reserved.</p>
    </footer>
</body>
</html>
