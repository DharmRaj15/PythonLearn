{% extends "base.html" %}
{% block title %}My First App{% endblock %}
    {% block content %}
    <header>
        <h1>Welcome to My First App</h1>
    </header>
    <main>
        <p>This is a simple HTML template for your application.</p>
        <p>{{myValue}}</p>
        <p>{{myList}}</p>
        <ul>
            {% for item in myList %}

                <li {% if item == 4 %} style="color: red;"{% endif %}>{{ item }}</li>

            {% endfor %}
        </ul>

        <a href="{{url_for('other') }}">Go to Other Page</a>    
    </main>
   {% endblock %}
